name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webpc/package-lock.json
      - run: npm ci --prefix webpc
      - run: npm test --prefix webpc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libxcb1-dev libclang-dev clang
      - run: cargo check --locked -p jianxin-cli -p jianxin-desktop
      - run: cargo test --locked -p jianxin-cli -p jianxin-desktop
      - name: Swift notification wrapper
        if: runner.os == 'macOS'
        run: swiftc -typecheck -framework AppKit -framework UserNotifications platform/macos/Jianxin.swift
