[package]
name = "jianxin-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
description = "Cross-platform Jianxin tray and unread mail panel"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
jianxin-config.workspace = true
jianxin-core.workspace = true
serde_json.workspace = true
gpui-kit = "0.7"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Foundation"] }

[dev-dependencies]
jianxin-domain.workspace = true
jianxin-store.workspace = true

[[bin]]
name = "jianxin-desktop"
path = "src/main.rs"
