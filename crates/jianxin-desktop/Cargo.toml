[package]
name = "jianxin-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
description = "Jianxin native tray and embedded Web reader"
build = "../../platform/windows/build.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
jianxin-config.workspace = true
jianxin-core.workspace = true
jianxin-domain.workspace = true
jianxin-store.workspace = true
jianxin-web.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
ureq.workspace = true
uuid.workspace = true
ammonia = "4.2"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString", "NSGeometry", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.18"

[dev-dependencies]
jianxin-domain.workspace = true
jianxin-store.workspace = true

[[bin]]
name = "jianxin-desktop"
path = "src/main.rs"
