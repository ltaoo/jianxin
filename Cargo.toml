[workspace]
resolver = "2"
members = [
  "crates/jianxin-domain",
  "crates/jianxin-config",
  "crates/jianxin-provider",
  "crates/jianxin-store",
  "crates/jianxin-core",
  "crates/jianxin-agent",
  "crates/jianxin-tui",
  "crates/jianxin-cli",
  "crates/jianxin-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Multi-provider email client (CLI + TUI), Rust implementation"

# ---------------------------------------------------------------------------
# Shared dependency versions. Keep every crate on the same versions so the
# dependency graph stays a single copy.
# ---------------------------------------------------------------------------
[workspace.dependencies]
jianxin-domain = { path = "crates/jianxin-domain" }
jianxin-config = { path = "crates/jianxin-config" }
jianxin-provider = { path = "crates/jianxin-provider" }
jianxin-store = { path = "crates/jianxin-store" }
jianxin-core = { path = "crates/jianxin-core" }
jianxin-agent = { path = "crates/jianxin-agent" }
jianxin-tui = { path = "crates/jianxin-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
dotenvy = "0.15"
base64 = "0.22"
ureq = "2"
embed-resource = "3.0"

# Network / mail protocols
imap = "2.4"
native-tls = "0.2"
mailparse = "0.16"
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "native-tls",
  "builder",
  "hostname",
] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# UI
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# Named profile used by the macOS app packaging script.
[profile.macos-app]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
